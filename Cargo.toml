[package]
name = "any-task"
version = "0.0.7"
authors = ["Tumypmyp"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
dioxus-liveview = { version = "0.7", default-features = false }
dioxus-desktop = { version = "0.7", features = ["gnu"] }
dioxus-sdk-storage = "0.7"
dioxus-history = "0.7"
dioxus-html = "0.7"
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", default-features = false, version = "0.0.1" }

serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
time = { version = "0.3", features = ["local-offset"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
prost-types = "0.14"
url = "2.5"
anyhow = "1.0"
prost = "0.14"
tonic-prost = "0.14"
keyring-core = "1.0"
keyring = { version = "4.1", features = ["cli", "android-native-keyring-store"] }
zeroize = "1.9"
arboard = "3.6"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
time = { version = "0.3.44", features = ["local-offset"] }
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
pretty_env_logger = "0.5"
http-body-util = "0.1"
bytes = "1"
serde_json = "1.0"
form_urlencoded = "1"
http = "1"
futures-util = { version = "0.3", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }

# [target.x86_64-pc-windows-gnu]
# rustflags = ["-L", "native/"]
# linker = "x86_64-w64-mingw32-gcc"
# ar = "x86_64-w64-mingw32-ar"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
bundle = []

[profile.wasm-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[build]
target-dir = "target"
output-dir = "target"

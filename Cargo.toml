[package]
name = "any-task"
version = "0.0.5"
authors = ["Tumypmyp"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
dioxus-liveview = { version = "0.7", default-features = false }
dioxus-desktop = { version = "0.7" }
dioxus-sdk-storage = { version = "0.7" }

serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1.41"
dirs = "6.0.0"
serde_json = "1.0.143"
once_cell = "1.21.3"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", default-features = false, version = "0.0.1" }
dioxus-history = "0.7"
dioxus-icons = { version = "0.1.0", default-features = false }
time = { version = "0.3.44", default-features = false }
dioxus-i18n = "0.5.1"
tonic = "0.14.6"
prost = "0.14.3"
tonic-prost = "0.14.6"
prost-types = "0.14.3"

[build-dependencies]
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
time = { version = "0.3.44", features = ["local-offset"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
pretty_env_logger = "0.5"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
form_urlencoded = "1"
http = "1"
futures-util = { version = "0.3", default-features = false }
hyper-util = { version = "0.1.18", features = ["tokio"] }

[target.x86_64-pc-windows-gnu]
rustflags = ["-L", "native/"]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
bundle = []

[profile.wasm-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[build]
target-dir = "target"
output-dir = "target"
